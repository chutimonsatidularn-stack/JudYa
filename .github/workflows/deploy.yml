# Publishes the real app (app/dist) to GitHub Pages at /JudYa/, next to the old MedMate files so the installed old app keeps opening (ADR-0006, ADR-0007).
# Needs Settings → Pages → Source = "GitHub Actions" (the owner changes this once).
name: deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Put the old MedMate app beside the new one (never edited)
        run: |
          mkdir site
          cp -r app/dist/. site/
          cp medmate-app.html medmate-app.json medmate-sw.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
