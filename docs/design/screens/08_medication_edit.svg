า</text><rect x="132" y="290" width="234" height="44" rx="10" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><text x="146" y="318" class="t" font-size="13" font-weight="400" fill="#4F6A85" text-anchor="start">เม็ด / แคปซูล</text><text x="24" y="373" class="t" font-size="12" font-weight="500" fill="#4F6A85" text-anchor="start">จำนวนที่เหลือ</text><rect x="132" y="344" width="234" height="44" rx="10" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><text x="146" y="372" class="t" font-size="13" font-weight="400" fill="#4F6A85" text-anchor="start">30 เม็ด</text><text x="24" y="427" class="t" font-size="12" font-weight="500" fill="#4F6A85" text-anchor="start">กำหนดการเติมยา</text><rect x="132" y="398" width="234" height="44" rx="10" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><text x="146" y="426" class="t" font-size="13" font-weight="400" fill="#4F6A85" text-anchor="start">ทุก 30 วัน</text><text x="24" y="466" class="t" font-size="14" font-weight="700" fill="#0B3A6B" text-anchor="start">ทานวันไหน</text><rect x="24" y="478" width="88" height="48" rx="24" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><text x="68" y="507" class="t" font-size="13" font-weight="600" fill="#0B3A6B" text-anchor="middle">ทุกวัน</text><rect x="120" y="478" width="100" height="48" rx="24" fill="#0B3A6B"/><g transform="translate(134,493) scale(0.75)" color="#FFFFFF" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="180" y="507" class="t" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">เลือกวัน</text><rect x="228" y="478" width="112" height="48" rx="24" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><text x="284" y="507" class="t" font-size="13" font-weight="600" fill="#0B3A6B" text-anchor="middle">วันเว้นวัน</text><rect x="24" y="534" width="104" height="48" rx="24" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><text x="76" y="563" class="t" font-size="13" font-wei