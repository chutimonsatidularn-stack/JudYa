<title>MedMate — Share</title><rect width="390" height="844" fill="#F7FAFC"/><text x="28" y="37" class="t" font-size="30" font-weight="400" fill="#1F3A56" text-anchor="middle">‹</text><text x="195" y="35" class="t" font-size="17" font-weight="700" fill="#1F3A56" text-anchor="middle">แชร์ข้อมูล</text><rect x="24" y="72" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="55" cy="109" r="20" fill="#EAF4FF"/><text x="55" y="115" class="t" font-size="17" font-weight="700" fill="#1F3A56" text-anchor="middle">⌁</text><text x="88" y="101" class="t" font-size="13" font-weight="700" fill="#1F3A56" text-anchor="start">ลิงก์สำหรับคนในครอบครัว</text><text x="88" y="122" class="t" font-size="10" font-weight="400" fill="#64748B" text-anchor="start">ให้คนในบ้านดูข้อมูลและสถานะยา</text><text x="342" y="115" class="t" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">›</text><rect x="24" y="158" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="55" cy="195" r="20" fill="#EAF4FF"/><text x="55" y="201" class="t" font-size="17" font-weight="700" fill="#1F3A56" text-anchor="middle">▧</text><text x="88" y="187" class="t" font-size="13" font-weight="700" fill="#1F3A56" text-anchor="start">รูปสรุปข้อมูล</text><text x="88" y="208" class="t" font-size="10" font-weight="400" fill="#64748B" text-anchor="start">เป็นรูปภาพพร้อมส่งในไลน์</text><text x="342" y="201" class="t" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">›</text><rect x="24" y="244" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="55" cy="281" r="20" fill="#EAF4FF"/><text x="55" y="287" class="t" font-size="17" font-weight="700" fill="#1F3A56" text-anchor="middle">▤</text><text x="88" y="273" class="t" font-size="13" font-weight="700" fill="#1F3A56" text-anchor="start">ไฟล์ PDF</text><text x="88" y="294" class="t" font-size="10" font-weight="400" fill="#64748B" text-anchor="start">สำหรับแพทย์หรือเก็บไว้</text><text x="342" y="287" class="t" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">›</text><rect x="24" y="330" width="342" height="74" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><circle cx="55" cy="367" r="20" fill="#EAF4FF"/><text x="55" y="373" class="t" font-size="17" font-weight="700" fill="#1F3A56" text-anchor="middle">♧</text><text x="88" y="359" class="t" font-size="13" font-weight="700" fill="#1F3A56" text-anchor="start">เชิญสมาชิกใหม่</text><text x="88" y="380" class="t" font-size="10" font-weight="400" fill="#64748B" text-anchor="start">ส่งลิงก์ให้เข้ามาช่วยจัดการยา</text><text x="342" y="373" class="t" font-size="22" font-weight="400" fill="#64748B" text-anchor="middle">›</text><rect x="24" y="430" width="342" height="76" rx="14" fill="#DDF3E6"/><text x="40" y="456" class="t" font-size="12" font-weight="700" fill="#1F3A56" text-anchor="start">ความเป็นส่วนตัว</text><text x="40" y="478" class="t" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">ข้อมูลสุขภาพควรแชร์เฉพาะคนที่ไว้ใจ</text></svg>
