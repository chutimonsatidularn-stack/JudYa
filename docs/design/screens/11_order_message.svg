<title>MedMate — Order Message</title><rect width="390" height="844" fill="#F7FAFC"/><text x="28" y="37" class="t" font-size="30" font-weight="400" fill="#1F3A56" text-anchor="middle">‹</text><text x="195" y="35" class="t" font-size="17" font-weight="700" fill="#1F3A56" text-anchor="middle">รายการยาสำหรับสั่ง</text><rect x="24" y="62" width="342" height="64" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="40" y="86" class="t" font-size="15" font-weight="700" fill="#1F3A56" text-anchor="start">ร้านยาสุขใจ</text><text x="40" y="108" class="t" font-size="11" font-weight="400" fill="#64748B" text-anchor="start">รวม 8 รายการ · 1,250 บาท</text><text x="345" y="94" class="t" font-size="20" font-weight="600" fill="#1F3A56" text-anchor="middle">□</text><text x="24" y="150" class="t" font-size="13" font-weight="700" fill="#1F3A56" text-anchor="start">สั่งยา:</text><text x="40" y="178" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">1) Losartan 50 mg 30 เม็ด</text><text x="40" y="209" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">2) Amlodipine 5 mg 30 เม็ด</text><text x="40" y="240" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">3) Metformin 500 mg 60 เม็ด</text><text x="40" y="271" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">4) Atorvastatin 20 mg 30 เม็ด</text><text x="40" y="302" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">5) Calcium 600 mg 60 เม็ด</text><text x="40" y="333" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">6) Vitamin D 1000 IU 30 เม็ด</text><text x="40" y="364" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">7) Omeprazole 20 mg 30 เม็ด</text><text x="40" y="395" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">8) Cetirizine 10 mg 30 เม็ด</text><text x="24" y="446" class="t" font-size="13" font-weight="700" fill="#1F3A56" text-anchor="start">ข้อความที่จะส่ง</text><rect x="24" y="458" width="342" height="120" rx="14" fill="#EAF4FF"/><text x="40" y="484" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">สวัสดีค่ะ ขอสั่งยาตามรายการนี้ค่ะ</text><text x="40" y="508" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">รบกวนแจ้งยอดและวันที่จัดส่งด้วยค่ะ</text><text x="40" y="532" class="t" font-size="11" font-weight="500" fill="#0F172A" text-anchor="start">ขอบคุณค่ะ</text><rect x="24" y="610" width="342" height="52" rx="14" fill="#1F3A56"/><text x="195.0" y="641.0" class="t" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">คัดลอกข้อความ</text><rect x="24" y="674" width="342" height="48" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="195.0" y="703.0" class="t" font-size="14" font-weight="700" fill="#1F3A56" text-anchor="middle">เปิด LINE</text></svg>
