"14" font-weight="500" fill="#0B3A6B" text-anchor="start">7) Omeprazole 20 mg 30 เม็ด</text><text x="40" y="408" class="t" font-size="14" font-weight="500" fill="#0B3A6B" text-anchor="start">8) Cetirizine 10 mg 30 เม็ด</text><text x="24" y="464" class="t" font-size="14" font-weight="700" fill="#0B3A6B" text-anchor="start">ข้อความที่จะส่ง</text><rect x="24" y="476" width="342" height="124" rx="16" fill="#E6F4FF"/><text x="40" y="506" class="t" font-size="14" font-weight="500" fill="#0B3A6B" text-anchor="start">สวัสดีค่ะ ขอสั่งยาตามรายการนี้ค่ะ</text><text x="40" y="534" class="t" font-size="14" font-weight="500" fill="#0B3A6B" text-anchor="start">รบกวนแจ้งยอดและวันที่จัดส่งด้วยค่ะ</text><text x="40" y="562" class="t" font-size="14" font-weight="500" fill="#0B3A6B" text-anchor="start">ขอบคุณค่ะ</text><rect x="24" y="620" width="342" height="52" rx="14" fill="#0B3A6B"/><text x="195" y="651" class="t" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">คัดลอกข้อความ</text><rect x="24" y="684" width="342" height="48" rx="14" fill="#FFFFFF" stroke="#D5E3F0" stroke-width="1"/><g transform="translate(128,696) scale(1)" color="#0B3A6B" fill="none" stroke="#0B3A6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/></g><text x="164" y="713" class="t" font-size="14" font-weight="700" fill="#0B3A6B" text-anchor="start">เปิด LINE</text><text x="195" y="764" class="t" font-size="12" font-weight="400" fill="#4F6A85" text-anchor="middle">แอพไม่ส่งข้อความเอง คัดลอกแล้วนำไปวางใน LINE</text></svg>